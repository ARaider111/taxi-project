{% extends "base_admin.html" %}
{% load static %}

{% block title %}Добавить клиента{% endblock %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/client_form.css' %}">

<div class="client-form-page">

    <div class="client-page-header">
        <div>
            <h1>Добавить клиента</h1>
            <p class="client-page-subtitle">
                Заполните данные нового клиента
            </p>
        </div>

        <a href="{% url 'clients_list' %}" class="client-back-link">
            ← Назад к клиентам
        </a>
    </div>

    <div class="client-form-card">

        <form method="post">
            {% csrf_token %}

            <div class="client-form-grid">

                <div class="client-form-field">
                    <label for="lname">Фамилия</label>
                    <input
                        type="text"
                        id="lname"
                        name="lname"
                        required
                        maxlength="128"
                        placeholder="Введите фамилию"
                    >
                </div>

                <div class="client-form-field">
                    <label for="fname">Имя</label>
                    <input
                        type="text"
                        id="fname"
                        name="fname"
                        required
                        maxlength="128"
                        placeholder="Введите имя"
                    >
                </div>

                <div class="client-form-field">
                    <label for="patronimyc">Отчество</label>
                    <input
                        type="text"
                        id="patronimyc"
                        name="patronimyc"
                        maxlength="128"
                        placeholder="Введите отчество"
                    >
                </div>

                <div class="client-form-field">
                    <label for="phone">Телефон</label>
                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        required
                        maxlength="12"
                        placeholder="+79991234567"
                    >
                </div>

            </div>

            <div class="client-form-footer">

                <a
                    href="{% url 'clients_list' %}"
                    class="client-btn client-btn-cancel"
                >
                    Отмена
                </a>

                <button
                    type="submit"
                    class="client-btn client-btn-save"
                >
                    Сохранить клиента
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
