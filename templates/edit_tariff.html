{% extends "base_admin.html" %}
{% block title %}Редактировать тариф{% endblock %}

{% block content %}
<h1>Редактировать тариф</h1>
<p><a href="{% url 'tariffs_list' %}">← Назад к списку</a></p>

<form method="post">
    {% csrf_token %}

    <p>
        <label>Название:<br>
            <input type="text" name="name" value="{{ tariff.name }}" required>
        </label>
    </p>

    <p>
        <label>Цена:<br>
            <input type="number" step="0.01" name="price" value="{{ tariff.price }}" required>
        </label>
    </p>

    <p>
        <label>Время с:<br>
            <input type="time" name="time_from" value="{{ tariff.time_from|date:'H:i' }}" required>
        </label>
    </p>

    <p>
        <label>Время по:<br>
            <input type="time" name="time_to" value="{{ tariff.time_to|date:'H:i' }}" required>
        </label>
    </p>

    <p>
    <label>Дни недели:<br>
        {% for value, label in days_choices %}
        <label>
            <input type="checkbox" name="days_of_week" value="{{ value }}"
                   {% if value in selected_days %}checked{% endif %}>
            {{ label }}
        </label>
        {% endfor %}
    </label>
</p>

    <p>
        <button type="submit">Сохранить</button>
    </p>
</form>
{% endblock %}
