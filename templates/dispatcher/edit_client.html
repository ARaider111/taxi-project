{% extends "dispatcher/base_dispatcher.html" %}
{% block title %}Редактировать клиента{% endblock %}

{% block content %}
<h1>Редактировать клиента</h1>
<p><a href="{% url 'dispatcher_clients' %}">← Назад к списку</a></p>

<form method="post">
    {% csrf_token %}

    <p>
        <label>Фамилия:<br>
            <input type="text" name="lname" value="{{ client.lname }}" required>
        </label>
    </p>

    <p>
        <label>Имя:<br>
            <input type="text" name="fname" value="{{ client.fname }}" required>
        </label>
    </p>

    <p>
        <label>Отчество (необязательно):<br>
            <input type="text" name="patronimyc" value="{{ client.patronimyc|default:'' }}">
        </label>
    </p>

    <p>
        <label>Телефон:<br>
            <input type="text" name="phone" value="{{ client.phone }}" required>
        </label>
    </p>

    <p>
        <button type="submit">Сохранить</button>
    </p>
</form>
{% endblock %}
