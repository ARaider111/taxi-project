{% extends "base_admin.html" %}
{% block title %}Редактировать смену{% endblock %}

{% block content %}
<h1>Редактировать смену</h1>
<p><a href="{% url 'shifts_list' %}">← Назад к списку</a></p>

<form method="post">
    {% csrf_token %}

    <p>
        <label>Водитель:<br>
            <select name="driver" required>
                {% for d in drivers %}
                <option value="{{ d.driver_id }}" {% if d.driver_id == shift.driver.driver_id %}selected{% endif %}>
                    {{ d.lname }} {{ d.fname }} ({{ d.car_model }} {{ d.car_number }})
                </option>
                {% endfor %}
            </select>
        </label>
    </p>

    <p>
        <label>Начало смены:<br>
            <input type="datetime-local" name="start_shift" required
                   value="{{ shift.start_shift|date:'Y-m-d\TH:i' }}">
        </label>
    </p>

    <p>
        <label>Конец смены:<br>
            <input type="datetime-local" name="end_shift" required
                   value="{{ shift.end_shift|date:'Y-m-d\TH:i' }}">
        </label>
    </p>

    <p>
        <label>Открыл пользователь:<br>
            <select name="opened_user">
                <option value="">— не выбрано —</option>
                {% for u in users %}
                <option value="{{ u.user_id }}" {% if shift.opened_user and u.user_id == shift.opened_user.user_id %}selected{% endif %}>
                    {{ u.lname }} {{ u.fname }} ({{ u.role }})
                </option>
                {% endfor %}
            </select>
        </label>
    </p>
    
    <p>
        <label>Закрыл пользователь:<br>
            <select name="closed_user">
                <option value="">— не выбрано —</option>
                {% for u in users %}
                <option value="{{ u.user_id }}" {% if shift.closed_user and u.user_id == shift.closed_user.user_id %}selected{% endif %}>
                    {{ u.lname }} {{ u.fname }} ({{ u.role }})
                </option>
                {% endfor %}
            </select>
        </label>
    </p>

    <p>
        <button type="submit">Сохранить</button>
    </p>
</form>
{% endblock %}
