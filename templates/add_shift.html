{% extends "base_admin.html" %}
{% block title %}Добавить смену{% endblock %}

{% block content %}
<h1>Добавить смену</h1>
<p><a href="{% url 'shifts_list' %}">← Назад к списку</a></p>

<form method="post">
    {% csrf_token %}

    <p>
        <label>Водитель:<br>
            <select name="driver" required>
                {% for d in drivers %}
                <option value="{{ d.driver_id }}">
                    {{ d.lname }} {{ d.fname }} ({{ d.car_model }} {{ d.car_number }})
                </option>
                {% endfor %}
            </select>
        </label>
    </p>

    <p>
        <label>Начало смены:<br>
            <input type="datetime-local" name="start_shift" required>
        </label>
    </p>

    <p>
        <label>Конец смены:<br>
            <input type="datetime-local" name="end_shift" required>
        </label>
    </p>

    <p>
        <button type="submit">Создать смену</button>
    </p>
</form>
{% endblock %}
