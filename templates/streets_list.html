{% extends "base_admin.html" %}
{% block title %}Улицы{% endblock %}

{% block content %}
<h1>Улицы</h1>
<p>
    <a href="{% url 'add_street' %}">Добавить улицу</a>
</p>
<form method="get" style="margin-bottom: 20px;">
    <label for="q">Поиск:</label>
    <input type="text" name="q" id="q" value="{{ query }}" placeholder="Название улицы">

    <button type="submit">Найти</button>
    <a href="{% url 'streets_list' %}" style="margin-left: 10px;">Сбросить</a>
</form>
<table border="1" cellpadding="6">
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Район</th>
        <th>Действия</th>
    </tr>
    {% for s in streets %}
    <tr>
        <td>{{ s.street_id }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.district.name }}</td>
        <td>
            <a href="{% url 'edit_street' s.street_id %}">Редактировать</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">Нет улиц</td></tr>
    {% endfor %}
</table>
{% endblock %}
